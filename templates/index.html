<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Luxe</title>
    <style>
        body { font-family: 'serif'; background-color: #fdfaf5; color: #333; text-align: center; margin: 0; padding: 20px; }
        header { margin-bottom: 50px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        h1 { letter-spacing: 5px; font-weight: 300; }
        .collections-grid { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
        .collection-item { width: 400px; background: white; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .collection-item img { width: 100%; height: auto; display: block; margin-bottom: 15px; }
        h3 { font-size: 1.2rem; letter-spacing: 1px; color: #444; }
    </style>
</head>
<body>
    <header>
        <p style="font-size: 0.8rem; letter-spacing: 2px; color: #999;">HIGH JEWELRY & WEARABLE ART</p>
        <h1>MAISON LUXE</h1>
        <nav>
            <span style="margin: 0 15px; font-size: 0.9rem; letter-spacing: 1px;">COLLECTIONS</span>
            <span style="margin: 0 15px; font-size: 0.9rem; letter-spacing: 1px;">THE ART OF REPOUSSÈ</span>
            <span style="margin: 0 15px; font-size: 0.9rem; letter-spacing: 1px;">CONTACT</span>
        </nav>
    </header>

    <div class="collections-grid">
        {% for item in collections %}
        <div class="collection-item">
            <img src="{{ url_for('static', filename=item.image) }}" alt="{{ item.name }}">
            <h3>{{ item.name }}</h3>
        </div>
        {% endfor %}
    </div>
</body>
</html>
